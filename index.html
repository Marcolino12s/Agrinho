<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AgroNova | Agricultura Sustentável</title>

  <meta name="description" content="Projeto sobre agricultura sustentável e inovação no campo.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HERO -->
  <header class="hero">

    <nav>
      <h1>Agro<span>Nova</span></h1>

      <button class="menu-mobile" id="menuToggle">☰</button>

      <ul id="menu">
        <li><a href="#sobre" id="navSobre">Sobre</a></li>
        <li><a href="#projetos" id="navProjetos">Projetos</a></li>
        <li><a href="#resultados" id="navResultados">Resultados</a></li>
      </ul>

      <div class="controls">
        <select id="languageSelect">
          <option value="pt">PT</option>
          <option value="en">EN</option>
          <option value="es">ES</option>
        </select>

        <select id="fontSizeSelect">
          <option value="small">A-</option>
          <option value="medium" selected>A</option>
          <option value="large">A+</option>
        </select>

        <button id="themeToggle">🌙</button>
      </div>
    </nav>

    <div class="hero-content">

      <p class="tag" id="heroTag">INOVAÇÃO • SUSTENTABILIDADE</p>

      <h2 id="heroTitle">
        Agricultura forte,<br> inteligente e sustentável.
      </h2>

      <p id="heroDescription">
        Tecnologia e sustentabilidade trabalhando juntas no campo.
      </p>

      <button id="explorarBtn">Ver mais</button>

    </div>

  </header>

  <!-- SOBRE -->
  <section class="sobre" id="sobre">
    <div>
      <h3 id="sobreTitulo">Produzir sem destruir</h3>
      <p id="sobreTexto"></p>
    </div>

    <div class="cards">
      <div class="card">
        <h4 id="card1Titulo"></h4>
        <p id="card1Texto"></p>
      </div>

      <div class="card">
        <h4 id="card2Titulo"></h4>
        <p id="card2Texto"></p>
      </div>

      <div class="card">
        <h4 id="card3Titulo"></h4>
        <p id="card3Texto"></p>
      </div>
    </div>
  </section>

  <!-- PROJETOS -->
  <section class="projetos" id="projetos">

    <h3 id="exemplos">Exemplos</h3>

    <div class="grid">

      <div class="card">
        <h4 id="projeto1Titulo"></h4>
        <p id="projeto1Texto"></p>
      </div>

      <div class="card">
        <h4 id="projeto2Titulo"></h4>
        <p id="projeto2Texto"></p>
      </div>

      <div class="card">
        <h4 id="projeto3Titulo"></h4>
        <p id="projeto3Texto"></p>
      </div>

    </div>

  </section>

  <!-- RESULTADOS -->
  <section class="resultados" id="resultados">

    <div class="box">
      <h3 id="resultadosTitulo"></h3>

      <div class="stats">
        <p id="resultado1"></p>
        <p id="resultado2"></p>
        <p id="resultado3"></p>
      </div>
    </div>

  </section>

  <footer>
    <p id="footerText"></p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
