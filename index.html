<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AgroNova | Agricultura Sustentável</title>

  <meta name="description" content="Projeto Agrinho sobre agricultura sustentável, inovação no campo e preservação ambiental.">

  <meta name="keywords" content="agrinho, agricultura sustentável, agro, inovação, meio ambiente, sustentabilidade">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HERO -->
  <header class="hero">

    <nav>

      <h1>Agro<span>Nova</span></h1>

      <button class="menu-mobile" id="menuToggle" aria-label="Abrir menu">☰</button>

      <ul id="menu">
        <li><a href="#sobre" id="navSobre">Sobre</a></li>
        <li><a href="#praticas" id="navPraticas">Práticas</a></li>
        <li><a href="#projetos" id="navProjetos">Projetos</a></li>
        <li><a href="#resultados" id="navResultados">Resultados</a></li>
      </ul>

      <div class="controls">

        <select id="fontSizeSelect">
          <option value="small" id="optSmall">Pequena</option>
          <option value="medium" id="optMedium" selected>Média</option>
          <option value="large" id="optLarge">Grande</option>
        </select>

        <select id="languageSelect">
          <option value="pt">PT</option>
          <option value="en">EN</option>
          <option value="es">ES</option>
        </select>

        <button id="themeToggle" aria-label="Alternar tema">🌙</button>

      </div>

    </nav>

    <div class="hero-content">

      <p class="tag" id="heroTag">INOVAÇÃO • PRESERVAÇÃO • TRANSFORMAÇÃO</p>

      <h2 id="heroTitle">Um agro forte,<br>inteligente e sustentável.</h2>

      <p class="description" id="heroDescription">
        Incentivando práticas agrícolas modernas, sustentáveis e conscientes.
      </p>

      <button id="explorarBtn">Ver mais</button>

    </div>

  </header>

  <!-- SOBRE -->
  <section class="sobre" id="sobre">

    <div class="texto">
      <h3 id="sobreTitulo">Produzir sem destruir</h3>
      <p id="sobreTexto"></p>
    </div>

    <div class="card-info">

      <div class="mini-card">
        <h4 id="card1Titulo"></h4>
        <p id="card1Texto"></p>
      </div>

      <div class="mini-card">
        <h4 id="card2Titulo"></h4>
        <p id="card2Texto"></p>
      </div>

      <div class="mini-card">
        <h4 id="card3Titulo"></h4>
        <p id="card3Texto"></p>
      </div>

    </div>

  </section>

  <!-- PROJETOS -->
  <section class="projetos" id="projetos">

    <div class="section-title">
      <p id="secao">SUSTENTABILIDADE</p>
      <h3 id="exemplos">Exemplos e resultados</h3>
    </div>

    <div class="galeria">

      <div class="projeto-card">
        <img src="https://images.unsplash.com/photo-1464226184884-fa280b87c399?q=80&w=800&auto=format&fit=crop">
        <div class="conteudo">
          <h4 id="projeto1Titulo"></h4>
          <p id="projeto1Texto"></p>
        </div>
      </div>

      <div class="projeto-card">
        <img src="https://images.unsplash.com/photo-1625246333195-78d9c38ad449?q=80&w=800&auto=format&fit=crop">
        <div class="conteudo">
          <h4 id="projeto2Titulo"></h4>
          <p id="projeto2Texto"></p>
        </div>
      </div>

      <div class="projeto-card">
        <img src="https://images.unsplash.com/photo-1416879595882-3373a0480b5b?q=80&w=800&auto=format&fit=crop">
        <div class="conteudo">
          <h4 id="projeto3Titulo"></h4>
          <p id="projeto3Texto"></p>
        </div>
      </div>

    </div>

  </section>

  <!-- RESULTADOS -->
  <section class="resultados" id="resultados">

    <div class="resultado-box">

      <h3 id="resultadosTitulo"></h3>

      <div class="numeros">

        <div>
          <h2>+40%</h2>
          <p id="resultado1"></p>
        </div>

        <div>
          <h2>-30%</h2>
          <p id="resultado2"></p>
        </div>

        <div>
          <h2>+60%</h2>
          <p id="resultado3"></p>
        </div>

      </div>

    </div>

  </section>

  <footer>
    <p id="footerText"></p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
